name: content-integrity

# Runs the 18 content invariants from feedback/ui-testing-plan.md §12.1.
#
# Hard release blocker. All 18 invariants must pass.
#
# If a future content edit introduces a finding, the right response is one of:
#   (a) Fix the data so the invariant passes (preferred)
#   (b) Add the kanji / particle / construct to the appropriate augmented set
#       in tools/check_content_integrity.py (with a comment explaining why it's
#       legitimately in N5 scope)
# Never silence by removing the check or re-enabling continue-on-error.
#
# Manual run:
#   python tools/check_content_integrity.py            # short summary
#   python tools/check_content_integrity.py -v         # full violation list

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    defaults:
      run:
        working-directory: N5
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        # 2026-05-27: previously the integrity job had no `pip install`
        # step, which meant JA-146 (xlsx Fix-Commit cell validator) always
        # reported "openpyxl not installed — install with `pip install
        # openpyxl` to enable this check" and the run exited 1. The check
        # had been red on every commit going back many releases. Adding
        # openpyxl unblocks JA-146 so it can actually validate the
        # specifications/test-scenarios-by-specialist-perspective.xlsx
        # "User Reported Bugs" sheet on every push. PyYAML is also pulled
        # in defensively for any tool that might `import yaml`.
        run: pip install openpyxl PyYAML

      - name: Run all content integrity invariants (171 as of 2026-05-26)
        run: python tools/check_content_integrity.py -v
        env:
          PYTHONIOENCODING: utf-8

      # Removed 2026-05-21: `python tools/test_build_data.py` step.
      # That script was a KB-markdown-era build-pipeline regression
      # test (pre-2026-05-14 KB → data/ merge). The KB no longer
      # exists and the script was archived to not-required/tools-
      # archive/test_build_data_kb_era.py. Modern equivalent: the
      # integrity invariants above cover the data/ file shapes that
      # the legacy test used to assert.

      - name: Run design-system compliance checks (Zen Modern)
        # Currently NON-BLOCKING (continue-on-error: true) as of
        # 2026-05-21. The 8 D-rules surfaced 112 pre-existing
        # violations when the workflow was first activated (the
        # workflow had been orphaned at N5/.github/workflows/ until
        # commit 127124e moved it to the correct repo-root location).
        # 112 violations is too large to fix in the workflow-
        # activation batch. They're a known backlog to address in a
        # separate close-out cycle. The check still runs and logs
        # the violation list for visibility; it just doesn't fail
        # the build until the backlog is paid down.
        #
        # Rules (8): D-1 no pictograph emojis, D-2 font weights
        # 300/400/500 only, D-3 no box-shadow, D-4 no transform on
        # :hover, D-5 brand accent via tokens, D-6 border-radius
        # 2/4/6/8/999, D-7 text-transform uppercase|none|capitalize,
        # D-8 no decorative text-shadow.
        # Source: specifications/jlpt-n5-design-system-zen-modern.md
        continue-on-error: true
        run: python tools/check_design_system.py -v
        env:
          PYTHONIOENCODING: utf-8

  # ---------------------------------------------------------------------------
  # N4. Added 2026-09-30. Until now NOTHING under /N4/ ran in CI: the job above
  # is N5-only (note its working-directory), so N4's own 43 invariants and the
  # practice-bank validator were local-only gates.
  #
  # That gap had already cost something. On 2026-09-29 a data/ change flipped 24
  # glyphs out of the n5_prerequisite set in N4/data/n4_kanji_readings.json,
  # which made ordinary N5 kanji read as out-of-scope and failed 5 practice
  # items. Every one of the 43 repo invariants stayed green, because
  # practice_validate.py is the only gate that reads that set and it lived in a
  # gitignored folder. The validator and its 15 banks are now committed (~205 KB;
  # see the exception block in .gitignore) so this job can run them.
  #
  # Both scripts are stdlib-only, so this job needs no pip install. `_refcache/`
  # stays out of the repo: practice_validate.py falls back to the bundled 11 KB
  # _jmdict_index.json, verified to give the same verdict on all 15 banks and to
  # still catch a planted non-word option.
  #
  # Manual run:
  #   cd N4 && python tools/check_content_integrity.py -v
  #   cd N4/Workbook/N4_Kanji_Workbook && for b in w*_bank.json; do python practice_validate.py "$b"; done
  n4-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run N4 content integrity invariants (43 as of 2026-09-30)
        working-directory: N4
        run: python tools/check_content_integrity.py -v
        env:
          PYTHONIOENCODING: utf-8

      - name: Validate all 15 practice banks (Worlds 1-14 + mock)
        working-directory: N4/Workbook/N4_Kanji_Workbook
        # Each bank is validated separately because the allowed kanji pool is
        # cumulative per world; one bad bank must fail the job, so the loop
        # records the failure and keeps going to report every affected world
        # rather than stopping at the first.
        run: |
          shopt -s nullglob
          banks=(w*_bank.json)
          if [ ${#banks[@]} -ne 15 ]; then
            echo "expected 15 practice banks, found ${#banks[@]}: ${banks[*]}"
            exit 1
          fi
          fail=0
          for b in "${banks[@]}"; do
            echo "::group::$b"
            python practice_validate.py "$b" || fail=1
            echo "::endgroup::"
          done
          exit $fail
        env:
          PYTHONIOENCODING: utf-8
