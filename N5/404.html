<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JLPT N5 Tutor</title>
<meta name="description" content="JLPT N5 study material. Loading...">
<meta name="robots" content="noindex">
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", "Noto Sans CJK JP", sans-serif; max-width: 760px; margin: 0 auto; padding: 1rem; line-height: 1.6; color: #1a1a1a; }
  h1 { font-size: 1.4em; color: #14452a; }
  a { color: #1a5c38; }
</style>
<script>
  // SPA redirect for deep links to routes that don't have a static
  // mirror. Pattern from https://github.com/rafgraph/spa-github-pages
  // (MIT). The script captures the requested path + query, encodes
  // them into a single query string on the SPA root (index.html), and
  // GitHub Pages serves index.html. The decoder in index.html's <head>
  // then unpacks the query and replaceState's the URL back to the
  // clean form before the SPA boots: the URL bar shows the original
  // deep link, the SPA reads location.pathname, and renders the route.
  //
  // We detect the SPA root by looking for "/N5/" in the pathname (the
  // canonical N5 base segment). If not found, default to "/" (local dev).
  (function () {
    var pn = location.pathname;
    var m = pn.match(/^(.*\/N5\/)/);
    var base = m ? m[1] : '/';
    var depth = base === '/' ? 1 : (base.match(/\//g) || []).length;
    var sub = pn.substr(base.length);  // e.g. "drill/" or "learn/n5-001/"
    // rafgraph encoding: path segments use ~ for /, ~~ for ~, query
    // string is preserved after &.
    var p = sub ? sub.replace(/&/g, '~and~').replace(/\//g, '~') : '';
    var q = location.search ? location.search.slice(1).replace(/&/g, '~amp~') : '';
    var hash = location.hash || '';
    location.replace(
      base + '?spa-redirect=1'
      + (p ? '&p=' + encodeURIComponent(p) : '')
      + (q ? '&q=' + encodeURIComponent(q) : '')
      + hash
    );
  }());
</script>
</head>
<body>
  <h1>Loading…</h1>
  <p>If you are not redirected automatically, <a href="/">go to the JLPT N5 homepage</a>.</p>
</body>
</html>
